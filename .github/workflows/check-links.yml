name: Check Links

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label, such as `ubuntu-latest`, or a JSON list, such as `["self-hosted", "linux"]`.
        type: string
        default: ubuntu-latest
      ruby-version:
        description: Ruby version to install, or `default` to read `.ruby-version` from the site.
        type: string
        default: default
      working-directory:
        description: Directory of the Jekyll site, relative to the repository root.
        type: string
        default: .
      setup-command:
        description: Shell command to run in the site directory before installing Ruby, such as installing libraries.
        type: string
        default: ''
      build-command:
        description: Command that builds the site.
        type: string
        default: bundle exec jekyll build
      cache-file:
        description: Link checker cache file, relative to the site directory.
        type: string
        default: .cache/link-checker.json
      cache-key-prefix:
        description: Prefix of the GitHub Actions cache keys that hold the link checker cache.
        type: string
        default: link-checker-
      report-artifact:
        description: Name of the artifact that holds the Markdown report of each run, or `false` to skip uploading it.
        type: string
        default: link-checker-report
      issue:
        description: >-
          Keep an issue with the dead links up to date: `false` for none, `true` for an issue titled
          `Broken Links`, another title, or an issue number such as `123`.
        type: string
        default: 'false'

# Jobs inherit the caller's permissions: `contents: read`, and `issues: write` with `issue: true`.

jobs:
  check:
    name: Check Links
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run Setup Command
      if: inputs.setup-command != ''
      env:
        SETUP_COMMAND: ${{ inputs.setup-command }}
      run: eval "$SETUP_COMMAND"
    - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        working-directory: ${{ inputs.working-directory }}
        bundler-cache: true
    - name: Restore Link Checker Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.cache-file }}
        key: ${{ inputs.cache-key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ inputs.cache-key-prefix }}
    - name: Build and Check Links
      env:
        LINK_CHECKER_REPORT: ${{ runner.temp }}/link-checker-report.md
        BUILD_COMMAND: ${{ inputs.build-command }}
        LINK_CHECKER: '1'
        LINK_CHECKER_CACHE: ${{ github.workspace }}/${{ inputs.working-directory }}/${{ inputs.cache-file }}
      run: eval "$BUILD_COMMAND"
    - name: Write Job Summary
      if: always()
      env:
        REPORT: ${{ runner.temp }}/link-checker-report.md
      run: |
        if [ -f "$REPORT" ]; then
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload Report
      if: always() && inputs.report-artifact != 'false' && inputs.report-artifact != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-artifact }}
        path: ${{ runner.temp }}/link-checker-report.md
        if-no-files-found: ignore
    - name: Update Issue
      if: always() && inputs.issue != 'false' && inputs.issue != ''
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        REPORT: ${{ runner.temp }}/link-checker-report.md
        ISSUE: ${{ inputs.issue }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [ ! -f "$REPORT" ]; then
          echo "No link checker report, so the build failed before checking links; leaving the issue unchanged."
          exit 0
        fi
        dead=$(sed -n 's/^<!-- jekyll-ruby-link-checker dead links: \([0-9]*\) -->$/\1/p' "$REPORT" | head -n 1)
        # `true` uses the default title, a number names an issue, and anything else is a title.
        if [ "$(printf '%s' "$ISSUE" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          ISSUE="Broken Links"
        fi
        number=""
        state=""
        title=""
        if printf '%s' "$ISSUE" | grep -Eq '^#?[0-9]+$'; then
          number="${ISSUE#\#}"
          state=$(gh issue view "$number" --json state --jq .state)
        else
          title="$ISSUE"
          number=$(TITLE="$title" gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            state=OPEN
          fi
        fi
        if [ "${dead:-0}" -gt 0 ]; then
          body="$(cat "$REPORT")"$'\n\n'"From $RUN_URL."
          # Issue bodies are limited to 65,536 characters.
          if [ "${#body}" -gt 65000 ]; then
            body="${body:0:65000}"$'\n\n'"The report is truncated; see the job summary of $RUN_URL."
          fi
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue edit "$number" --body "$body"
            if [ "$state" = "CLOSED" ]; then
              gh issue reopen "$number"
            fi
          fi
        elif [ "$state" = "OPEN" ]; then
          gh issue close "$number" --comment "All links work, as of $RUN_URL."
        fi
    # GitHub caches can't be overwritten, so every run saves a new key and the next run restores the newest.
    # Save even when dead links fail the build: the cache is written as each check succeeds.
    - name: Save Link Checker Cache
      if: always() && hashFiles(format('{0}/{1}', inputs.working-directory, inputs.cache-file)) != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.cache-file }}
        key: ${{ inputs.cache-key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
