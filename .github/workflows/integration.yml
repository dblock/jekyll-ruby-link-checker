name: Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check-links:
    uses: ./.github/workflows/check-links.yml
    permissions:
      contents: read
    with:
      ruby-version: '4.0'
      working-directory: spec/fixtures/site
      # The build fails unless the setup command ran first, in the site directory.
      setup-command: touch .setup-done
      build-command: test -f .setup-done && bundle exec jekyll build
      cache-key-prefix: integration-link-checker-

  # A second upload under the same name would fail, so this also checks that `false` skips the upload.
  # Also adds a dead link, which only warns with `fail-on-dead-links: false`, to a page that the pull request
  # doesn't change, so it checks all pages.
  check-links-without-report:
    uses: ./.github/workflows/check-links.yml
    permissions:
      contents: read
    with:
      ruby-version: '4.0'
      working-directory: spec/fixtures/site
      setup-command: printf '\n[Missing](/missing/)\n' >> index.md
      cache-key-prefix: integration-link-checker-
      report-artifact: 'false'
      fail-on-dead-links: false
      changed-files-only: false

  # Publishes the report of this run: on a pull request, the fixture has no dead links and no comment exists, so
  # this checks the pull request and its comments and changes nothing; on master, it checks for an open issue.
  publish:
    needs: check-links
    uses: ./.github/workflows/publish-report.yml
    permissions:
      actions: read
      issues: write
      pull-requests: write
    with:
      issue: Integration Broken Links

  # The action in action.yml, as a step after a checkout, from this pull request's code.
  action:
    name: Check Links with the Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 2
    - uses: ./
      with:
        ruby-version: '4.0'
        working-directory: spec/fixtures/site
        setup-command: touch .setup-done
        build-command: test -f .setup-done && bundle exec jekyll build
        cache-key-prefix: integration-link-checker-action-
        report-artifact: link-checker-report-action

  report:
    name: Check Report Artifact
    needs: [check-links, check-links-without-report, action]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: link-checker-report
    - name: Check Report
      run: |
        cat link-checker-report.md
        grep -qx '<!-- jekyll-ruby-link-checker dead links: 0 -->' link-checker-report.md
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: link-checker-report-action
        path: action
    - name: Check Report of the Action
      run: |
        cat action/link-checker-report.md
        grep -qx '<!-- jekyll-ruby-link-checker dead links: 0 -->' action/link-checker-report.md
    # The workflow without a report uploads nothing, so there are two: the workflow's and the action's.
    - name: Check Only Two Reports Were Uploaded
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        count=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" --jq '.total_count')
        echo "Artifacts: $count"
        test "$count" -eq 2
    - name: Check Dead Links Only Warned
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        job=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" \
          --jq '.jobs[] | select(.name == "check-links-without-report / Check Links") | .id')
        gh api "repos/$GH_REPO/check-runs/$job/annotations" \
          --jq '.[] | "\(.annotation_level): \(.message)"' | tee annotations.txt
        grep -qx 'warning: Found 1 dead link(s); see the job summary.' annotations.txt
