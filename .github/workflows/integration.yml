name: Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check-links:
    uses: ./.github/workflows/check-links.yml
    permissions:
      contents: read
      issues: write
    with:
      ruby-version: '4.0'
      working-directory: spec/fixtures/site
      # The build fails unless the setup command ran first, in the site directory.
      setup-command: touch .setup-done
      build-command: test -f .setup-done && bundle exec jekyll build
      cache-key-prefix: integration-link-checker-
      # The fixture has no dead links, so this checks for an open issue and changes nothing.
      issue: true
      issue-title: Integration Broken Links
