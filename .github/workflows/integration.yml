name: Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check-links:
    uses: ./.github/workflows/check-links.yml
    permissions:
      contents: read
    with:
      ruby-version: '4.0'
      working-directory: spec/fixtures/site
      # The build fails unless the setup command ran first, in the site directory.
      setup-command: touch .setup-done
      build-command: test -f .setup-done && bundle exec jekyll build
      cache-key-prefix: integration-link-checker-

  # A second upload under the same name would fail, so this also checks that `false` skips the upload.
  check-links-without-report:
    uses: ./.github/workflows/check-links.yml
    permissions:
      contents: read
    with:
      ruby-version: '4.0'
      working-directory: spec/fixtures/site
      cache-key-prefix: integration-link-checker-
      report-artifact: 'false'

  # Publishes the report of this run: on a pull request, the fixture has no dead links and no comment exists, so
  # this checks the pull request and its comments and changes nothing; on master, it checks for an open issue.
  publish:
    needs: check-links
    uses: ./.github/workflows/publish-report.yml
    permissions:
      actions: read
      issues: write
      pull-requests: write
    with:
      issue: Integration Broken Links

  report:
    name: Check Report Artifact
    needs: [check-links, check-links-without-report]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: link-checker-report
    - name: Check Report
      run: |
        cat link-checker-report.md
        grep -qx '<!-- jekyll-ruby-link-checker dead links: 0 -->' link-checker-report.md
    - name: Check Only One Report Was Uploaded
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        count=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" --jq '.total_count')
        echo "Artifacts: $count"
        test "$count" -eq 1
