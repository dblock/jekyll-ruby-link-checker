name: Publish Link Checker Report

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label, such as `ubuntu-latest`, or a JSON list, such as `["self-hosted", "linux"]`.
        type: string
        default: ubuntu-latest
      run-id:
        description: Run that uploaded the report; defaults to the run that triggered `workflow_run`, or this run.
        type: string
        default: ''
      report-artifact:
        description: Name of the artifact that holds the report.
        type: string
        default: link-checker-report
      comment:
        description: Keep a comment with the report up to date on pull requests.
        type: boolean
        default: true
      issue:
        description: >-
          Keep an issue with the dead links on the default branch up to date: `false` for none, `true` for an issue
          titled `Broken Links`, another title, or an issue number such as `123`.
        type: string
        default: 'false'

# Jobs inherit the caller's permissions: `actions: read` to download the report, `pull-requests: write` for
# comments, and `issues: write` for the issue. This workflow never checks out or runs the checked code, and
# treats the report as data, so it can publish results of pull requests from forks with `workflow_run`.

jobs:
  publish:
    name: Publish Report
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPORT: ${{ github.workspace }}/link-checker/link-checker-report.md
      PR_FILE: ${{ github.workspace }}/link-checker/link-checker-pr.txt
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      RUN_URL: >-
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        inputs.run-id || github.event.workflow_run.id || github.run_id }}
    steps:
    # A build that fails before checking links uploads no report.
    - name: Download Report
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.report-artifact }}
        path: ${{ github.workspace }}/link-checker
        run-id: ${{ inputs.run-id || github.event.workflow_run.id || github.run_id }}
        github-token: ${{ github.token }}
    - name: Comment on Pull Request
      if: >-
        inputs.comment && contains(fromJSON('["pull_request", "pull_request_target"]'),
        github.event.workflow_run.event || github.event_name)
      env:
        MARKER: <!-- jekyll-ruby-link-checker report -->
      run: |
        set -euo pipefail
        if [ ! -f "$REPORT" ] || [ ! -f "$PR_FILE" ]; then
          echo "No report for a pull request; nothing to publish."
          exit 0
        fi
        number=$(tr -dc '0-9' < "$PR_FILE")
        # The report comes from the checked run, so only trust its number when that pull request is still at the
        # checked commit; a newer commit gets its own run.
        head=$(gh api "repos/$GH_REPO/pulls/$number" --jq .head.sha)
        if [ "$head" != "$HEAD_SHA" ]; then
          echo "::warning::Pull request #$number is at $head, not the checked $HEAD_SHA; not commenting."
          exit 0
        fi
        dead=$(sed -n 's/^<!-- jekyll-ruby-link-checker dead links: \([0-9]*\) -->$/\1/p' "$REPORT" | head -n 1)
        comment=$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate \
          --jq '.[] | select(.body | startswith(env.MARKER)) | .id' | head -n 1)
        # Comment once there are dead links, and keep that comment up to date afterwards.
        if [ "${dead:-0}" -eq 0 ] && [ -z "$comment" ]; then
          exit 0
        fi
        body="$MARKER"$'\n'"$(cat "$REPORT")"$'\n\n'"From $RUN_URL."
        if [ "${#body}" -gt 65000 ]; then
          body="${body:0:65000}"$'\n\n'"The report is truncated; see the job summary of $RUN_URL."
        fi
        if [ -n "$comment" ]; then
          gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment" -f body="$body" > /dev/null
        else
          gh pr comment "$number" --body "$body"
        fi
    - name: Update Issue
      if: >-
        inputs.issue != 'false' && inputs.issue != ''
        && !contains(fromJSON('["pull_request", "pull_request_target"]'),
        github.event.workflow_run.event || github.event_name)
        && (github.event.workflow_run.head_branch || github.ref_name) == github.event.repository.default_branch
      env:
        ISSUE: ${{ inputs.issue }}
      run: |
        set -euo pipefail
        if [ ! -f "$REPORT" ]; then
          echo "No link checker report, so the build failed before checking links; leaving the issue unchanged."
          exit 0
        fi
        dead=$(sed -n 's/^<!-- jekyll-ruby-link-checker dead links: \([0-9]*\) -->$/\1/p' "$REPORT" | head -n 1)
        # `true` uses the default title, a number names an issue, and anything else is a title.
        if [ "$(printf '%s' "$ISSUE" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          ISSUE="Broken Links"
        fi
        number=""
        state=""
        title=""
        if printf '%s' "$ISSUE" | grep -Eq '^#?[0-9]+$'; then
          number="${ISSUE#\#}"
          state=$(gh issue view "$number" --json state --jq .state)
        else
          title="$ISSUE"
          number=$(TITLE="$title" gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            state=OPEN
          fi
        fi
        if [ "${dead:-0}" -gt 0 ]; then
          body="$(cat "$REPORT")"$'\n\n'"From $RUN_URL."
          # Issue bodies are limited to 65,536 characters.
          if [ "${#body}" -gt 65000 ]; then
            body="${body:0:65000}"$'\n\n'"The report is truncated; see the job summary of $RUN_URL."
          fi
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue edit "$number" --body "$body"
            if [ "$state" = "CLOSED" ]; then
              gh issue reopen "$number"
            fi
          fi
        elif [ "$state" = "OPEN" ]; then
          gh issue close "$number" --comment "All links work, as of $RUN_URL."
        fi
